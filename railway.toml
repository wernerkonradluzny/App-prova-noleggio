# Railway reads this instead of guessing. Vite only produces static files, so
# without a start command the container would build, exit, and look "undeployed".
[build]
builder = "NIXPACKS"
# Dev tooling (Vite, Tailwind) is needed to produce dist/, even though it is not
# needed at runtime. --include=dev keeps those packages when NODE_ENV=production.
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
startCommand = "npx serve -s dist -l tcp://0.0.0.0:$PORT"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
